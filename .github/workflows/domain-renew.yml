name: DNSHE Domain Auto-Renew

on:
  schedule:
    - cron: "0 2 1 * *"      # 每月1号 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false        # 一个账号失败不影响其他账号
      matrix:
        # 👇 账号编号列表: 有 3 个账号就写 [1, 2, 3]; 只有一个就写 [1]
        account: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run domain check & auto-renew (account ${{ matrix.account }})
        env:
          # 动态取本账号专属的 Secrets 对
          DNSHE_API_KEY: ${{ secrets[format('DNSHE_API_KEY_{0}', matrix.account)] }}
          DNSHE_API_SECRET: ${{ secrets[format('DNSHE_API_SECRET_{0}', matrix.account)] }}
          # ---------- 可选通知 (所有账号共用一套) ----------
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "===== 正在处理 DNSHE 账号 #${{ matrix.account }} ====="
          python dnshe_renew.py --auto-renew --days 180 --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload log artifact (account ${{ matrix.account }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-log-acct${{ matrix.account }}-${{ github.run_id }}
          path: logs/
          retention-days: 30
